name: render_citations_stats

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/render_citations_stats.yml
      - google_scholar.Rmd
      - google_scholar_viz.Rmd
      - _data/publications_affiliations.csv
  workflow_dispatch:
  schedule:
    - cron: '17 2 1 * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: render-citations-stats

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev
          Rscript -e 'packages <- c("scholar", "rmarkdown", "yaml", "rvest", "dplyr", "ggplot2", "readr"); install.packages(packages); stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))'

      - name: Export Google Scholar data
        run: Rscript -e 'rmarkdown::render("google_scholar.Rmd", output_dir = tempdir())'

      - name: Render citation charts
        run: Rscript -e 'rmarkdown::render("google_scholar_viz.Rmd", output_dir = tempdir())'

      - name: Commit and push citation data
        run: |
          git add _data/scholar.yaml _data/citation_history.csv _data/publications_google_scholar.csv \
            _data/publications_citations_per_years.csv images/julien_tap_publications_citations_affiliations.png \
            images/julien_tap_h_index_affiliations.png
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Google Scholar citation data'
            git push origin "HEAD:${GITHUB_REF}"
          fi

      - name: Request a GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
